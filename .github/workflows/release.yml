name: Release Xiaobai Auto Editing

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace "^v", ""
          "XIAOBAI_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt

      - name: Bundle FFmpeg and FFprobe
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          $ffmpeg = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg\tools" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg\tools" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "Chocolatey FFmpeg binaries were not found."
          }
          New-Item -ItemType Directory -Force "desktop\bin\windows" | Out-Null
          Copy-Item $ffmpeg.FullName "desktop\bin\windows\ffmpeg.exe"
          Copy-Item $ffprobe.FullName "desktop\bin\windows\ffprobe.exe"

      - name: Build Windows application
        shell: pwsh
        env:
          PYTHON_BIN: python
        run: .\desktop\build_windows.ps1

      - name: Build Setup executable
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }
          & $iscc "/DAppVersion=$env:XIAOBAI_VERSION" "desktop\windows_installer.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error
          compression-level: 0

  build-macos:
    name: Build macOS installer
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Resolve version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "XIAOBAI_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements.txt

      - name: Build macOS application
        env:
          PYTHON_BIN: python
        run: bash desktop/build_macos.sh

      - name: Verify and package DMG
        run: |
          codesign --verify --deep --strict "dist/小白自动剪辑.app"
          bash desktop/package_macos_dmg.sh

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: release/*.dmg
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: 小白自动剪辑 ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 安装

            - Windows：下载 `XiaobaiAutoEditing-*-Windows-Setup.exe` 并运行安装。
            - macOS：下载对应架构的 `.dmg`，将“小白自动剪辑”拖入“应用程序”。当前未使用 Apple 开发者证书签名，首次启动请按住 Control 点击应用并选择“打开”。
            - macOS 需要先安装 FFmpeg：`brew install ffmpeg`。Windows 安装包已内置 FFmpeg 和 FFprobe。

            剪辑在本机完成。导出传输结束后，应用会删除临时成片及应用数据目录中的原视频副本，不修改用户选择的原始文件。
          files: |
            release-assets/windows-installer/*.exe
            release-assets/macos-installer/*.dmg
